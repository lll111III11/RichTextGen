<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浮动输入面板</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#ffffff; --text:#1b1b1b; --sub:#6a6a6a; --line:#e3e3e5;
    --input:#ffffff; --inputLine:#d6d6d6; --accent:#0067c0; --accentText:#ffffff;
    --hover:#eeeeef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#242424; --card:#2d2d2d; --text:#ffffff; --sub:#b8b8b8; --line:#3b3b3b;
      --input:#1e1e1e; --inputLine:#4a4a4a; --accent:#4cc2ff; --accentText:#10222e;
      --hover:#383838;
    }
  }
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;
       font-size:13px;display:flex;flex-direction:column;border:1px solid var(--line);
       box-sizing:border-box;border-radius:10px;user-select:none}

  /* ---------- 顶栏（拖动手柄） ---------- */
  #hd{display:flex;align-items:center;justify-content:space-between;height:22px;padding:0 6px 0 10px;
      background:var(--card);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;
      cursor:grab;flex-shrink:0}
  #hd.grabbing{cursor:grabbing}
  #hdSub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #hdX{border:0;background:none;color:var(--sub);font-size:13px;cursor:pointer;width:22px;height:20px;
       border-radius:5px;flex-shrink:0;line-height:1}
  #hdX:hover{background:var(--hover);color:var(--text)}

  /* ---------- 输入区 ---------- */
  #body{flex:1;display:flex;flex-direction:column;padding:7px 8px 6px;gap:6px;min-height:0}
  #typArea{width:100%;box-sizing:border-box;flex:1;min-height:46px;max-height:64px;resize:none;
      background:var(--input);color:var(--text);border:1px solid var(--inputLine);border-radius:7px;
      padding:6px 9px;font-size:13px;font-family:"Microsoft YaHei UI",sans-serif;line-height:1.45;outline:none}
  #typArea:focus{border-color:var(--accent)}
  #typArea::placeholder{color:var(--sub)}

  /* ---------- 工具行 ---------- */
  #tools{display:flex;align-items:center;gap:4px;flex-shrink:0}
  #sws{display:flex;gap:3px;flex-shrink:0}
  #sws button{width:17px;height:17px;border-radius:4px;border:1px solid var(--line);cursor:pointer;padding:0}
  #sws button:hover{outline:2px solid var(--accent);outline-offset:1px}
  #sws button.cust{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .sep{width:1px;height:16px;background:var(--line);margin:0 2px;flex-shrink:0}
  .tb{border:1px solid var(--inputLine);background:var(--input);color:var(--text);border-radius:5px;
      height:23px;min-width:23px;padding:0 5px;font-size:12px;cursor:pointer;line-height:1;flex-shrink:0}
  .tb:hover{background:var(--hover);border-color:var(--accent)}
  .tb.p{background:var(--accent);color:var(--accentText);border-color:transparent;font-weight:600;padding:0 12px}
  .tb.p:hover{filter:brightness(1.08)}
  #tip{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
       flex-shrink:0;line-height:1.3;min-height:14px}

  #toast{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;
         padding:4px 12px;border-radius:99px;font-size:11.5px;opacity:0;transition:opacity .18s;pointer-events:none;
         white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  #toast.on{opacity:1}
</style>
</head>
<body>

<div id="hd">
  <span id="hdSub">浮动输入</span>
  <button id="hdX" title="关闭 (Esc)">✕</button>
</div>

<div id="body">
  <textarea id="typArea" placeholder="输入文字…（选中部分后点格式，或直接点颜色）" spellcheck="false"></textarea>

  <div id="tools">
    <span id="sws"></span>
    <span class="sep"></span>
    <button class="tb" data-t="b" title="粗体"><b>B</b></button>
    <button class="tb" data-t="i" title="斜体"><i>I</i></button>
    <button class="tb" data-t="u" title="下划线"><u>U</u></button>
    <button class="tb" data-t="s" title="删除线"><s>S</s></button>
    <button class="tb" data-t="sup" title="上标">x²</button>
    <button class="tb" data-t="sub" title="下标">x₂</button>
    <button class="tb" data-g="3" title="循环渐变">🌈</button>
    <span class="sep"></span>
    <button class="tb p" id="go" title="回填到原窗口 (Ctrl+Enter)">回填</button>
  </div>

  <div id="tip">选定文字 → 点任意格式 → 自动回填</div>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';
  var QUICK = ['#FF0000','#FF8000','#FFFF00','#00C000','#00A0FF','#8000FF','#FFFFFF','#000000'];
  var mode = 'typ';        // 'sel' = 已捕获选区（点格式直接替换原选区）；'typ' = 手动输入
  var sel = { text:'', app:'' };
  var ta = document.getElementById('typArea');

  function $(id){ return document.getElementById(id); }
  function host(m){ try { window.chrome.webview.postMessage(m); } catch(e){} }
  function toast(s){
    var t = $('toast'); t.textContent = s; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 1500);
  }
  function b64(s){ return btoa(unescape(encodeURIComponent(s))); }

  /* ============================================================
     标签嵌套引擎（与主程序 TagRegistry 的 Order 一致）
     · 同一标签点第二次 = 取消；已有同标签只替换值，不层层嵌套
     · 多层按 Order 排序，b/i/u 在 color 外层
     ============================================================ */
  var ORDER = {
    align:1, pos:3, space:4, width:5, margin:6, indent:7, 'line-indent':8, 'line-height':9, br:10,
    b:20, i:21, u:22, s:23, sub:24, sup:25, nobr:26, noparse:27,
    uppercase:30, lowercase:31, smallcaps:32, allcaps:33,
    color:40, alpha:41, mark:42,
    size:50, font:51, 'font-weight':52,
    cspace:60, mspace:61, voffset:62, rotate:63, link:70
  };

  function tagBalanced(inner, tag){
    var re = new RegExp('<' + tag + '(?=[\\s=>])|</' + tag + '\\s*>', 'gi'), depth = 0, m;
    while ((m = re.exec(inner)) !== null){
      if (m[0].charAt(1) === '/'){ depth--; if (depth < 0) return false; }
      else depth++;
    }
    return depth === 0;
  }

  function parseChain(text){
    var wrappers = [], cur = String(text == null ? '' : text), guard = 0;
    while (guard++ < 16){
      var m = cur.match(/^<([a-zA-Z][\w-]*)(?:\s*=\s*("[^"]*"|[^>]*))?>/);
      if (!m) break;
      var tag = m[1], closeStr = '</' + m[1] + '>';
      if (cur.slice(-closeStr.length).toLowerCase() !== closeStr.toLowerCase()) break;
      var inner = cur.slice(m[0].length, cur.length - closeStr.length);
      if (!tagBalanced(inner, m[1])) break;
      wrappers.push({ tag: tag.toLowerCase(), open: m[0] });
      cur = inner;
    }
    return { wrappers: wrappers, inner: cur };
  }

  function buildChain(wrappers, inner){
    wrappers.sort(function(a, b){ return (ORDER[a.tag] || 99) - (ORDER[b.tag] || 99); });
    var out = inner;
    for (var i = wrappers.length - 1; i >= 0; i--){
      out = wrappers[i].open + out + '</' + wrappers[i].tag + '>';
    }
    return out;
  }

  function toggleWrap(text, tag, openTag){
    var c = parseChain(text), idx = -1;
    for (var i = 0; i < c.wrappers.length; i++) if (c.wrappers[i].tag === tag){ idx = i; break; }
    if (idx >= 0) c.wrappers.splice(idx, 1);
    else c.wrappers.push({ tag: tag, open: openTag });
    return buildChain(c.wrappers, c.inner);
  }

  function setColorTag(text, hex){
    var c = parseChain(text), found = false;
    for (var i = 0; i < c.wrappers.length; i++){
      if (c.wrappers[i].tag === 'color'){ c.wrappers[i].open = '<color=' + hex + '>'; found = true; break; }
    }
    if (!found) c.wrappers.push({ tag: 'color', open: '<color=' + hex + '>' });
    return buildChain(c.wrappers, c.inner);
  }

  function pad(n){ n = Math.max(0, Math.min(255, n)); return (n < 16 ? '0' : '') + n.toString(16).toUpperCase(); }

  function gradientText(text){
    var seg = String(text == null ? '' : text), out = '', k = 0;
    for (var i = 0; i < seg.length; i++){
      var ch = seg[i];
      if (ch === '\n' || ch === '\r'){ out += ch; if (ch === '\n') k = 0; continue; }
      var piece = ch;
      if (/[\uD800-\uDBFF]/.test(ch) && i + 1 < seg.length){ piece = seg[i] + seg[i + 1]; i++; }
      var t = (k % 5) / 4;
      var hex = '#' + pad(Math.round(255 + (0 - 255) * t)) + pad(0) + pad(Math.round(255 * t));
      out += '<color=' + hex + '>' + piece + '</color>';
      k++;
    }
    return out;
  }

  function compute(text, kind, arg){
    if (kind === 'color') return setColorTag(text, arg);
    if (kind === 'tag')   return toggleWrap(text, arg.tag, arg.open);
    if (kind === 'grad')  return gradientText(text);
    return text;
  }

  /* ---------- 色板（一行 8 个 + 自定义） ---------- */
  (function(){
    var box = $('sws');
    QUICK.forEach(function(c){
      var b = document.createElement('button');
      b.style.background = c;
      b.title = c;
      b.onclick = function(){ doFormat('color', c); };
      box.appendChild(b);
    });
    var cust = document.createElement('button');
    cust.className = 'cust';
    cust.title = '自定义颜色…';
    cust.onclick = function(){ host('f|pickColor'); };
    box.appendChild(cust);
  })();

  /* ---------- 统一入口：有选区就直接替换原窗口，没有就改输入框 ---------- */
  function doFormat(kind, arg){
    if (mode === 'sel' && sel.text.length){
      var next = compute(sel.text, kind, arg);
      host('f|paste|' + b64(next));
      return;
    }
    // 手动模式：只作用于 textarea 里选中的部分，没选就作用于全部
    var s = ta.selectionStart, e = ta.selectionEnd, all = ta.value;
    if (s === e){ s = 0; e = all.length; }
    if (e - s <= 0){ toast('先输入文字再套格式'); return; }
    var target = all.slice(s, e);
    var out = compute(target, kind, arg);
    ta.value = all.slice(0, s) + out + all.slice(e);
    ta.setSelectionRange(s, s + out.length);
    ta.focus();
  }

  $('tools').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.t) doFormat('tag', { tag: b.dataset.t, open: '<' + b.dataset.t + '>' });
    else if (b.dataset.g === '3') doFormat('grad');
  });

  /* ---------- 回填 ---------- */
  $('go').onclick = function(){
    if (mode === 'sel' && sel.text.length){
      // 选区模式：原样送回
      host('f|paste|' + b64(sel.text));
      return;
    }
    if (!ta.value.length){ toast('还没有内容'); return; }
    host('f|type|' + b64(ta.value));
  };

  $('typArea').addEventListener('input', function(){
    if (mode === 'sel' && ta.value !== sel.text){
      mode = 'typ';                 // 用户改了内容 → 转为手动模式
      $('hdSub').textContent = '手动输入';
      $('tip').textContent = '选中部分后点格式，只套住选中部分';
    }
  });

  $('typArea').addEventListener('keydown', function(ev){
    if (ev.ctrlKey && ev.key === 'Enter'){ ev.preventDefault(); $('go').click(); }
  });

  /* ---------- 顶栏拖动 / 关闭 ---------- */
  $('hdX').onclick = function(){ host('f|close'); };
  var dragging = false, lastX = 0, lastY = 0, hd = $('hd');
  hd.addEventListener('pointerdown', function(ev){
    if (ev.target === $('hdX')) return;
    dragging = true; lastX = ev.screenX; lastY = ev.screenY;
    hd.classList.add('grabbing');
    try { hd.setPointerCapture(ev.pointerId); } catch(e){}
  });
  hd.addEventListener('pointermove', function(ev){
    if (!dragging) return;
    var dx = ev.screenX - lastX, dy = ev.screenY - lastY;
    if (dx === 0 && dy === 0) return;
    lastX = ev.screenX; lastY = ev.screenY;
    host('f|move|' + dx + '|' + dy);
  });
  hd.addEventListener('pointerup', function(){ dragging = false; hd.classList.remove('grabbing'); });
  hd.addEventListener('pointercancel', function(){ dragging = false; hd.classList.remove('grabbing'); });

  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape'){ host('f|close'); }
  });

  /* ---------- C# 推下来的状态 ---------- */
  window.fpState = function(o){
    try { o = (typeof o === 'string') ? JSON.parse(o) : o; } catch(e){ return; }
    if (!o) return;

    var hasSel = (o.mode === 'sel' && (o.len || 0) > 0);
    sel = { text: o.text || '', app: o.app || '' };
    mode = hasSel ? 'sel' : 'typ';

    if (hasSel){
      ta.value = sel.text;
      ta.setSelectionRange(sel.text.length, sel.text.length);
      $('hdSub').textContent = (o.app || '目标窗口') + ' · 已选 ' + o.len + ' 字';
      $('tip').textContent = '点颜色 / 格式 → 直接替换原选区';
      toast('已捕获选区 ' + o.len + ' 字');
    } else {
      ta.value = '';
      $('hdSub').textContent = (o.app || '浮动输入');
      $('tip').textContent = '输入文字 → 回填；选中部分可只套选中';
      setTimeout(function(){ try { ta.focus(); } catch(e){} }, 60);
    }
  };

  window.fpSelColor = function(hex){
    if (mode === 'sel' && sel.text.length){ host('f|paste|' + b64(setColorTag(sel.text, hex))); }
    else doFormat('color', hex);
  };
  window.fpColorTyp = window.fpSelColor;

  window.ui = window.ui || {};
})();
</script>
</body>
</html>
