<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安装统计 · 彩色文本生成器</title>
<link rel="stylesheet" href="assets/style.css?v=20261024d" />
</head>
<body>
<div class="bg" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span></div>

<header class="top">
  <a class="brand" href="./">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="9" fill="url(#g)" opacity=".16"/><path d="M9 21.5 13 10h2l4 11.5M10.6 17.4h6.8" stroke="url(#g)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </span>
    <span class="brand-text">彩色文本生成器</span>
  </a>
  <div class="top-right">
    <span class="pill" id="verPill">v—</span>
    <a class="ghost" href="./">下载页</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>安装统计</h1>
    <p class="sub">历史记录页：数据来自 Cloudflare Pages Functions + KV，只有安装成功后由安装器上报，点击下载不计入。安装量按版本分别计数、互不累加；下载页不再展示安装量。页面每 30 秒自动刷新。</p>
  </section>

  <section class="card total-card">
    <span class="total-label">当前版本安装</span>
    <b class="total-num" id="total">—</b>
    <span class="total-updated"><span id="curVer">v—</span> · <span id="updated">读取中…</span></span>
  </section>

  <section class="card stat-list" aria-label="按版本统计">
    <h2 class="list-title">按版本</h2>
    <div id="verList"></div>
  </section>

  <section class="card stat-list" aria-label="按安装包统计">
    <h2 class="list-title">按安装包</h2>
    <div id="list" aria-live="polite"></div>
  </section>

  <footer class="foot">
    <p>接口：<a class="link" id="apiLink" href="#" target="_blank" rel="noopener">/api/count</a></p>
    <p class="dim">© 2026 彩色文本生成器 · <a class="link" href="https://github.com/lll111III11/RichTextGen" target="_blank" rel="noopener">GitHub 仓库</a> · <a class="link" href="https://github.com/lll111III11/RichTextGen/blob/main/LICENSE" target="_blank" rel="noopener">MIT 开源协议</a></p>
  </footer>
</main>

<script src="assets/stats.js?v=20261024d"></script>
</body>
</html>
