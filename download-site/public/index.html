<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>下载 · 彩色文本生成器</title>
<meta name="description" content="彩色文本生成器官方下载，自动测速选择最快线路。" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="bg" aria-hidden="true"><span class="glow g1"></span><span class="glow g2"></span></div>

<header class="top">
  <a class="brand" href="./">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="9" fill="url(#g)" opacity=".16"/><path d="M9 21.5 13 10h2l4 11.5M10.6 17.4h6.8" stroke="url(#g)" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </span>
    <span class="brand-text">彩色文本生成器</span>
  </a>
  <div class="top-right">
    <span class="pill" id="verPill">v—</span>
    <span class="net" id="netState"><i></i><em>测速中</em></span>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>选择版本，<span class="grad">自动走最快的路</span></h1>
    <p class="sub">下载前会对全部镜像做真实测速，优先使用延迟最低的一条；打不开的线路会被自动跳过。安装量在安装成功后由安装器自动上报。</p>
  </section>

  <section class="mirror card" aria-label="线路状态">
    <div class="mirror-head">
      <h2>下载线路</h2>
      <div class="mirror-actions">
        <label class="switch" title="自动选择最快线路">
          <input type="checkbox" id="autoPick" checked />
          <span>自动选线</span>
        </label>
        <button class="ghost" id="reprobe" type="button">重新测速</button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <p class="hint" id="mirrorHint">正在检测…</p>
  </section>

  <section class="grid" id="cards" aria-live="polite"></section>

  <section class="stats card">
    <div><b id="statTotal">—</b><span>累计安装</span></div>
    <div><b id="statFast">—</b><span>当前最快</span></div>
    <div><b id="statProbe">—</b><span>本次测速</span></div>
    <div><b id="statMode">—</b><span>计数状态</span></div>
  </section>

  <footer class="foot">
    <p>文件均通过 SHA-256 校验，下载后可自行核对。 · <a class="link" href="stats">安装统计</a> · <a class="link" href="studio">网页工作区（试验）</a></p>
    <p class="dim">© 2026 彩色文本生成器 · 静态分发站点</p>
  </footer>
</main>

<script src="assets/app.js"></script>
</body>
</html>
